[package]
name = "zenhash"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Portable hashing and streaming in safe Rust: XXH3, rapidhash v3 and FNV compatibility."
repository = "https://github.com/imazen/zenhash"
documentation = "https://docs.rs/zenhash"
readme = "README.crates.md"
keywords = ["hash", "xxhash", "xxh3", "simd", "no-std"]
categories = ["algorithms", "no-std"]
# Denylist, not an allowlist: a new runtime asset under src/ can't be forgotten.
exclude = [
    "/tests/**", "/benches/**", "/examples/**", "/fuzz/**", "/apidoc/**",
    "/docs/**", "/benchmarks/**", "/scripts/**", "/dev/**", "/tools/**",
    "/.github/**", "/.claude/**", "/.cargo/**", "/justfile", "/Cross.toml",
    "/CLAUDE.md", "/AGENTS.md", "/codecov.yml", "/*.log", "/*.sh", "/*.py",
    "/clippy.toml", "/deny.toml", "/_typos.toml", "/.gitignore",
]

[features]
default = ["std", "xxh3", "avx512"]
# Standard rapidhash v3, with portable output and allocation-free streaming.
rapidhash = []
# Stable FNV-1a compatibility fingerprints (32/64/128 bits).
fnv = []
# Classic algorithms for existing checksum and format interoperability.
xxh32 = []
xxh64 = []
# XXH3 64/128, streaming state, custom-secret errors, and SIMD dispatch.
xxh3 = ["dep:archmage", "dep:whereat"]
# archmage detects CPU features at runtime only with its `std` feature. Without
# it, dispatch sees only the features enabled at compile time.
std = ["archmage?/std", "whereat?/std"]
# Explicit I/O adapter; byte-slice and streaming APIs need neither feature.
io = ["std"]
# AVX-512 tier for the XXH3 accumulator. On by default; disable it with
# `default-features = false, features = ["std", "xxh3"]` to save compile time.
# Does not enable XXH3 by itself.
avx512 = ["archmage?/avx512"]
# Dev-only: lets tests disable SIMD tiers the target guarantees. Never in `default`.
_dev = ["archmage?/testable_dispatch"]

[dependencies]
archmage = { version = "=0.9.31-beta.2", default-features = false, optional = true }
whereat = { version = "0.1.5", default-features = false, optional = true }

[dev-dependencies]
rapidhash = { version = "4.5.1", default-features = false }
archmage = { version = "=0.9.31-beta.2", features = ["std"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash32", "xxhash64", "xxhash3_64", "xxhash3_128"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3", "xxh32", "xxh64"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenbench = "0.1.10"
# The C reference (xxHash 0.8.3 via xxhash-c-sys 0.8.7), for benches/adversarial.rs.
xxhash-c = "0.8.2"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Tests hash megabytes in debug builds; dependents never inherit this.
[profile.test]
opt-level = 2

[[bench]]
name = "hash"
harness = false
required-features = ["xxh3", "xxh32", "xxh64"]

[[bench]]
name = "adversarial"
harness = false
required-features = ["xxh3", "xxh32", "xxh64"]

[[example]]
name = "hash_file"
required-features = ["std", "xxh3"]

[[bench]]
name = "rapid"
harness = false
required-features = ["rapidhash"]
