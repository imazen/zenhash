[package]
name = "zenhash-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["xxh32", "xxh64", "rapidhash"]
xxh32 = ["zenhash/xxh32"]
xxh64 = ["zenhash/xxh64"]
rapidhash = ["zenhash/rapidhash"]

[dependencies]
libfuzzer-sys = "0.4"
rapidhash = { version = "4.5.1", default-features = false }
xxhash-rust = { version = "0.8.19", features = ["xxh3", "xxh32", "xxh64"] }
zenhash = { path = "..", features = ["xxh3"] }

[[bin]]
name = "hash_parity"
path = "fuzz_targets/hash_parity.rs"
test = false
doc = false
bench = false

# Standalone workspace so the parent crate never builds the fuzz tree.
[workspace]
