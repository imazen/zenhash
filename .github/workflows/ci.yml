name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # publish.yml runs the whole matrix at the release commit.
  workflow_call:

# Key on github.ref (set for pushes and PRs) so a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --no-default-features
      - name: Run all algorithms with a genuinely no_std dependency graph
        run: cargo test --manifest-path tools/stability/Cargo.toml --no-default-features --features xxh3,xxh32,xxh64,rapidhash,fnv
      # --all-features includes `avx512` and `_dev`, so the tier-permutation
      # test also disables tiers the target guarantees at compile time.
      - name: Test all algorithms against C outputs and SIMD tiers
        run: cargo test --all-features
      # Code under cfg!(target_feature = ...) and incant!'s compile-time
      # dispatch only compile when the target features are on for all code.
      # CPU-specific artifacts cannot be reused across heterogeneous runners.
      - name: Test with -C target-cpu=native using fresh artifacts
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: cargo test --all-features
        env:
          RUSTFLAGS: -D warnings -C target-cpu=native
          CARGO_TARGET_DIR: ${{ runner.temp }}/zenhash-native

  i686:
    name: Test (i686-unknown-linux-gnu, cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686
      - run: cross test --target i686-unknown-linux-gnu --all-features
      - run: cross test --target i686-unknown-linux-gnu --no-default-features
      - run: cross test --target i686-unknown-linux-gnu --no-default-features --features xxh3

  big-endian:
    name: Test (s390x big-endian, cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: s390x-unknown-linux-gnu
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-s390x
      # The only CI target where SIMD dispatch is skipped for byte order and
      # every little-endian read must byte-swap.
      - run: cross test --target s390x-unknown-linux-gnu --all-features

  wasm:
    name: WASM (wasm32-unknown-unknown check, wasm32-wasip1 tests)
    runs-on: ubuntu-latest
    env:
      # Preopen the checkout at its own path so tests that read files via
      # CARGO_MANIFEST_DIR (the fuzz regression seeds) can see them.
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=${{ github.workspace }}::${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: taiki-e/install-action@wasmtime
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --features xxh3
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --features rapidhash
      - shell: bash
        run: |
          cargo test --target wasm32-wasip1 --all-features --lib --tests
          cargo test --manifest-path tools/stability/Cargo.toml --target wasm32-wasip1 --no-default-features --features xxh3,xxh32,xxh64,rapidhash,fnv
        env:
          RUSTFLAGS: -D warnings -Ctarget-feature=-simd128
      - shell: bash
        run: |
          cargo test --target wasm32-wasip1 --all-features --lib --tests
          cargo test --manifest-path tools/stability/Cargo.toml --target wasm32-wasip1 --no-default-features --features xxh3,xxh32,xxh64,rapidhash,fnv
        env:
          RUSTFLAGS: -D warnings -Ctarget-feature=+simd128
      - name: Test wide arithmetic without SIMD
        run: cargo test --manifest-path tools/stability/Cargo.toml --target wasm32-wasip1 --all-features
        env:
          RUSTFLAGS: -D warnings -Ctarget-feature=-simd128,+wide-arithmetic
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime -Wwide-arithmetic=y
      - name: Test wide arithmetic with SIMD128
        run: cargo test --manifest-path tools/stability/Cargo.toml --target wasm32-wasip1 --all-features
        env:
          RUSTFLAGS: -D warnings -Ctarget-feature=+simd128,+wide-arithmetic
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime -Wwide-arithmetic=y

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features --features xxh3
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features --features rapidhash
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features --features fnv

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check --rust-version --all-features

  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check --feature-powerset --no-dev-deps
      - name: Test each algorithm alone (no_std library)
        shell: bash
        run: |
          for algorithm in xxh3 xxh32 xxh64 rapidhash fnv; do
            cargo test --no-default-features --features "$algorithm"
          done
      - run: cargo test --no-default-features --features std,rapidhash
      - name: Verify pinned C reference fixtures
        shell: bash
        run: |
          cc -O2 -Wall -Wextra tools/hash-conformance.c -o target/hash-conformance
          target/hash-conformance > target/conformance.txt
          diff -u tests/reference/conformance.txt target/conformance.txt
          cc -O2 -Wall -Wextra -Werror tools/hash-conformance-extended.c -o target/conformance-extended
          target/conformance-extended > target/conformance-extended.txt
          diff -u tests/reference/conformance-extended.txt target/conformance-extended.txt
          cc -O2 -Wall -Wextra -Werror tools/fnv-reference.c -o target/fnv-reference
          target/fnv-reference > target/fnv.txt
          diff -u tests/reference/fnv.txt target/fnv.txt
          target/fnv-reference bases > target/fnv-bases.txt
          diff -u tests/reference/fnv-bases.txt target/fnv-bases.txt

  stability-configs:
    name: Runtime feature powerset (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/stability
          key: stability-${{ matrix.shard }}
      - run: cargo hack test --manifest-path tools/stability/Cargo.toml --feature-powerset --partition ${{ matrix.shard }}/8

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      # The NEON and WASM tiers never compile on an x86 host. --all-targets
      # includes benches/adversarial.rs, whose C dependency (xxhash-c-sys)
      # needs a C compiler for the target.
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo clippy --all-targets --all-features --target aarch64-unknown-linux-gnu -- -D warnings
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      - run: cargo clippy --lib --no-default-features --features xxh3 --target wasm32-unknown-unknown -- -D warnings
        env:
          RUSTFLAGS: -D warnings -Ctarget-feature=+simd128
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: cargo package (builds the tarball crates.io would get)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package
      - name: Size budget
        run: |
          size=$(stat -c %s target/package/*.crate)
          echo "crate tarball: $size bytes"
          test "$size" -le 60000

  bench-build:
    name: Bench compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --all-features
      - run: cargo bench --no-run --no-default-features --features std,xxh3,xxh32,xxh64,rapidhash

  fuzz-build:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --all-targets
        working-directory: fuzz

  api-doc:
    name: Public-API snapshot is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly # rustdoc JSON needs nightly
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apidoc
      - run: cargo test --manifest-path apidoc/Cargo.toml
        env:
          ZEN_API_DOC: check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deny:
    name: cargo deny (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
